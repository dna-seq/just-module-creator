schema_version: '1.0'
module:
  title: Longevity-associated variants (2025-2026 literature)
  description: Thirteen positions in the genome that recent research links to living
    a long, healthy life — the two APOE sites, the FOXO3 site, and ten rare variants
    found in families where many members reached very old age. Each row records what
    one study reported, not a prediction about any person, and none of it is medical
    advice.
  report_title: Longevity and healthy aging
