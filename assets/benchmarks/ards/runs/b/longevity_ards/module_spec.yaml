schema_version: '1.0'
module:
  title: Age-Related Disease Factor and Longevity
  description: 263 lead variants of a shared age-related disease factor enriched for longevity
  report_title: Shared genetic architecture of age-related disease (mvARD)
  icon: heartbeat
  icon_set: fomantic
  color: '#6435c9'
  name: longevity_ards
