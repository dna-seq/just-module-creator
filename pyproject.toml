[project]
name = "just-module-creator"
version = "0.9.0"
description = "MCP server + Claude Code skill for authoring and publishing just-dna annotation modules"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "winternewt", email = "anton.kulaga@uni-rostock.de" }]
keywords = ["mcp", "fastmcp", "just-dna", "genomics", "annotation", "agent", "llm"]

dependencies = [
    # `tasks` extra enables real MCP background tasks (@mcp.tool(task=True)).
    # Default backend is in-memory (memory://) — zero config, no Redis needed.
    # Set FASTMCP_DOCKET_URL=redis://... only for distributed/persistent tasks.
    "fastmcp[tasks]>=3.4.7",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.16",
    "anyio>=4",
    # 0.5.4 across all three: it carries CitationHint.title, Finding.line,
    # hints.ATTESTATION_BEARING and the Ensembl unreachable/absent split, each of
    # which retires a mitigation here. Floored together because upstream versions
    # the three in lockstep.
    "just-dna-compiler>=0.5.4",
    "just-dna-format>=0.5.4",
    "just-dna-enricher>=0.5.4",
    # 0.14.0 is the floor because it is the release that projects a spec-directory
    # README.md onto the module card, and it adds `amend_readme` so an already-published
    # module's prose is repairable without spending a version number (F33). Below it,
    # every module we publish has a blank catalog card.
    "just-dna-registry>=0.14.0",
    "python-dotenv>=1.2.2",
    # Declared, not leaned on transitively: net.py calls httpx directly for the
    # literature sources, and a transitive pin is not a contract.
    "httpx>=0.28",
    # Already the enricher's retry idiom; we reuse it rather than hand-roll a loop.
    "tenacity>=9",
]

[project.scripts]
# Primary entrypoint. Subcommands: main | stdio | http | sse
just-module-creator = "just_module_creator.server:cli_app"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # Benign deprecation emitted inside opentelemetry (a transitive dep of
    # fastmcp + pydocket), not our code. Remove once upstream updates.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
