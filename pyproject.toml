[project]
name = "just-module-creator"
version = "0.19.0"
description = "MCP server and skills for authoring and publishing just-dna annotation modules; a Claude Code and Codex plugin"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "winternewt", email = "anton.kulaga@uni-rostock.de" }]
keywords = ["mcp", "fastmcp", "just-dna", "genomics", "annotation", "agent", "llm"]

dependencies = [
    # `tasks` extra enables real MCP background tasks (@mcp.tool(task=True)).
    # Default backend is in-memory (memory://) — zero config, no Redis needed.
    # Set FASTMCP_DOCKET_URL=redis://... only for distributed/persistent tasks.
    "fastmcp[tasks]>=3.4.7",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.16",
    "anyio>=4",
    # 0.6 is the first release where the three do NOT move in lockstep: format and
    # compiler stop at 0.6.1 while the enricher takes patches on its own. Two things
    # make the enricher floor the load-bearing one, and both fail silently below it:
    # under 0.6.2 a pass raises its *client's* exception type rather than the type the
    # pass documents, so `except FrequencyEnrichmentError` is dead; and under 0.6.3
    # `multi_allelic_rsids` keys the site on `ref`, so an ordinary ClinVar dup/del
    # mirror pair collapses onto one authored row and `draft_from_clinvar` drops the
    # second record as `already_present` (upstream S41 — 725 records over five genes,
    # 187 of them dropping the better-reviewed half). A drafter that quietly writes
    # fewer rows than the source has is the worst kind of floor to leave soft.
    # 0.6.4 carries the other half of that and is the real floor: re-drafting a
    # pre-0.6.3 panel recovers the dropped records but cannot retract the collapsed
    # rows, and below 0.6.4 nothing can find them. `_superseded_rsid_rows` is the only
    # thing that sees the condition — it holds the rsIDs the run is deliberately
    # writing by coordinate, which no file-level predicate can reconstruct, because a
    # coordinate row carries no rsid (upstream S45, our F36).
    "just-dna-compiler>=0.6.6",
    "just-dna-format>=0.6.6",
    "just-dna-enricher>=0.6.6",
    # 0.17.0 is the release that adopts format 0.6, and the floor has to move with ours:
    # its client reads `just_dna_format.layout` and the new manifest blocks unguarded, so a
    # 0.14 client beside a 0.6 format install is an AttributeError waiting inside a download.
    # It also adds `unreachable` to every check pass, which is what separates "gnomAD was
    # down" from "this module has no coverage" in a `registry_check` report.
    # 0.18.0 and 0.18.1 both declare `Client surface: unchanged` and both check out, so
    # nothing we call moved. The floor still goes to 0.18.1 because that release requires
    # enricher 0.6.3 itself — pinning it here means a resolver cannot hand us the new
    # enricher beside a registry built against the old one.
    "just-dna-registry>=0.18.1",
    "python-dotenv>=1.2.2",
    # Declared, not leaned on transitively: net.py calls httpx directly for the
    # literature sources, and a transitive pin is not a contract.
    "httpx>=0.28",
    # Already the enricher's retry idiom; we reuse it rather than hand-roll a loop.
    "tenacity>=9",
]

[project.scripts]
# Primary entrypoint. Subcommands: main | stdio | http | sse
just-module-creator = "just_module_creator.server:cli_app"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # Benign deprecation emitted inside opentelemetry (a transitive dep of
    # fastmcp + pydocket), not our code. Remove once upstream updates.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
