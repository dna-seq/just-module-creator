[project]
name = "just-module-creator"
version = "0.34.0"
description = "MCP server and skills for authoring and publishing just-dna annotation modules; a Claude Code and Codex plugin"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "winternewt", email = "anton.kulaga@uni-rostock.de" }]
keywords = ["mcp", "fastmcp", "just-dna", "genomics", "annotation", "agent", "llm"]

dependencies = [
    # `tasks` extra enables real MCP background tasks (@mcp.tool(task=True)).
    # Default backend is in-memory (memory://) — zero config, no Redis needed.
    # Set FASTMCP_DOCKET_URL=redis://... only for distributed/persistent tasks.
    "fastmcp[tasks]>=3.4.7",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.16",
    "anyio>=4",
    # **The floor is 0.7.0 because the registry instances are, and that is the S20
    # prediction arriving from the other side.** A registry serves ONE
    # `just-dna-format` contract and refuses a client on a different `0.x` minor in
    # EITHER direction. Measured 2026-09-03 with 0.7 installed against instances
    # serving 0.6.1: `registry_check`, `registry_validate`, publish, download and
    # import all returned `HTTP 409: just-dna-format contract mismatch`, while health,
    # search, whoami and get_module answered normally — a partial outage rather than a
    # version skew. Measured 2026-09-12, both instances now answer
    # `/api/v1/version` with `format: 0.7.0` / `compiler: 0.7.0` / `registry: 0.25.2`,
    # so the 409 now fires for a 0.6.6 client. The old floor became the broken end the
    # day the deployment moved, which is why a floor bump is adoption here and not
    # hygiene.
    #
    # **The `<0.8` ceiling is unchanged and is still the S20 decision.** It is about
    # the registry rather than about us: a floor cannot express "one minor, both ends",
    # so the upper bound is ours to hold whoever ships it. It costs the obvious thing
    # and the cost is deliberate — 0.8 does not arrive here on its own, so adopting it
    # is an explicit bump, run the same way this one was: read `/api/v1/version` off
    # both instances first and move the floor to what they serve.
    #
    #   curl -s https://module-registry.just-dna.life/api/v1/version
    #   curl -s https://module-polygon.just-dna.life/api/v1/version
    #
    # The 0.6.x floor reasoning this replaces is not lost, only subsumed: 0.6.2's
    # exception contract and 0.6.3/0.6.4's `multi_allelic_rsids` collapse (upstream
    # S41/S45, our F36) are all below 0.7.0. `docs/CHANGELOG.md` at 0.16.0 carries it.
    "just-dna-compiler>=0.7.0,<0.8",
    "just-dna-format>=0.7.0,<0.8",
    "just-dna-enricher[atlas]>=0.7.0,<0.8",
    # 0.25.2 is the first PUBLISHED client carrying the whole caching-proxy surface —
    # `cache_status`, `derived`, `draft`, the six `hint_*` methods and
    # `models.api.VariantHintReport`. Verified against the wheel rather than a sibling
    # checkout, which matters because seven of the nine landed on their client AFTER
    # the tree was stamped 0.25.0, so a floor naming 0.25.0 would assert a surface it
    # does not pin:
    #
    #   uv run --isolated --no-project --with 'just-dna-registry==0.25.2' python -c \
    #     "from just_dna_registry.client import RegistryClient as C; \
    #      import just_dna_registry.models.api as api; \
    #      print([n for n in ('cache_status','derived','draft','hint_variant', \
    #        'hint_variants','hint_citation','hint_gene','hint_trait', \
    #        'hint_old_assembly') if not hasattr(C, n)], \
    #        hasattr(api,'VariantHintReport'))"
    #
    # Run 2026-09-12: nothing missing, model present. That release declares
    # `just-dna-format>=0.7.0` itself, so the two floors travel together by the
    # resolver rather than by our remembering.
    "just-dna-registry>=0.25.2",
    "python-dotenv>=1.2.2",
    # Declared, not leaned on transitively: net.py calls httpx directly for the
    # literature sources, and a transitive pin is not a contract.
    "httpx>=0.28",
    # Already the enricher's retry idiom; we reuse it rather than hand-roll a loop.
    "tenacity>=9",
    # Same reason as httpx: `compare.py` and `audit.py` both call `yaml.safe_load`
    # on `module_spec.yaml` directly. Upstream's own loader is private
    # (`compiler._load_yaml`), so every consumer parses that file itself — asked for
    # as format-tree `S74`. Until then this is a direct call and a transitive pin is
    # not a contract.
    "pyyaml>=6",
    # The last rung of the supplementary ladder. `describe_supplementary` reads the
    # xlsx container by hand and needs nothing, but returning ROWS does: shared
    # strings, cell references and sparse cells are where four independent runs'
    # hand-rolled parsers each broke, two of them with a column-alignment bug.
    # openpyxl rather than `polars.read_excel`, on two grounds: polars builds a
    # DataFrame and infers a column schema, which silently coerces the mixed columns
    # a supplementary table is full of, and §5 says we do not build dataframes. Its
    # read-only mode streams, so a 50 MB workbook is not read into memory to reach
    # one sheet. `.xls` is out of scope and is reported as OUR limit, never as a
    # sheet with no rows.
    "openpyxl>=3.1.5",
]

[project.scripts]
# Primary entrypoint. Subcommands: main | stdio | http | sse
just-module-creator = "just_module_creator.server:cli_app"
manuscript = "manuscript.cli:app"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

# Second root module: the EASRP manuscript CLI lives at src/manuscript/,
# same layout as glucose-forecasting. uv_build defaults to one module named
# after the project; the list is what ships both.
[tool.uv.build-backend]
module-name = ["just_module_creator", "manuscript"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pypandoc-binary>=1.17",
    "tecto>=0.16.9",
    "grpcio-tools>=1.83.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # Benign deprecation emitted inside opentelemetry (a transitive dep of
    # fastmcp + pydocket), not our code. Remove once upstream updates.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# `assets/` is committed fixture material, not our code. The benchmark corpus
# carries the scratch scripts the runs wrote for themselves — an agent's own xlsx
# reader, its row builders — and those are evidence of what the tool could not do
# for them, which is the point of keeping them. Linting somebody else's working
# notes tells us nothing and would pressure us to edit the record.
exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
