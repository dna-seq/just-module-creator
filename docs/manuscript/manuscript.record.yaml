publication_sequence:
- Recover paper2 later-round raw outputs and tie the printed table to exact prompt/reference/model/host/plugin/server-build/attempt
  identifiers before posting. Git distinguishes this round from the committed preparation corpus; no numerical
  correction follows from their differing scores alone.
- Prepare one coordinated release of the shared format/compiler/enricher/registry contract; archive exact
  per-paper software and evaluation snapshots with their own manifests. Paper1 benchmarks and paper2 authoring
  corpus remain separate.
- Post paper1 first under the chosen preprint route and capture its persistent identifier. Its journal
  submission can proceed as its own paper1 ladder and author approval permit.
- Replace paper2's placeholder companion citation with paper1's citable preprint. Post paper2 when its
  own evidence is ready; it need not wait for paper1 acceptance. If arXiv is chosen for both, observe
  the submitter's new-submission quota and active-submission cap.
- Submit paper2 to the chosen paper2 journal after the preprint, with the distinct contribution and companion
  preprint disclosed. The two distinct papers can be considered in parallel; never submit the same manuscript
  concurrently to multiple journals.
- When paper2 has an identifier, update paper1's companion reference and release mapping; submit substantive
  bioRxiv changes before acceptance because its live pages disagree on the later boundary.
- After either journal version appears, update the corresponding preprint DOI/journal-reference metadata
  and the other paper's citation at its next permitted revision. Keep a version-specific preprint citation
  when it supports a result not retained in the journal version.
